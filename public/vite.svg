<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <!-- Background gradient: deep charcoal to pure black -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Text gradient: silver white to pure white -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background (better favicon shape) -->
  <rect width="192" height="192" rx="36" ry="36" fill="url(#bgGrad)"/>

  <!-- Subtle border ring -->
  <rect width="192" height="192" rx="36" ry="36" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- HU text with gradient and glow -->
  <text x="96" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="100" font-weight="800" text-anchor="middle" 
        fill="url(#textGrad)" filter="url(#glow)">HU</text>

  <!-- Optional: tiny accent dot above H (modern touch) -->
  <circle cx="66" cy="68" r="4" fill="#ffffff" opacity="0.6"/>
</svg>